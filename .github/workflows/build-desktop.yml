name: Build Desktop Installer (Tauri + Python Sidecar)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    name: Build Windows Application
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Install Root & Frontend Dependencies
        run: |
          npm install
          npm --prefix frontend install

      - name: Build Python Sidecar Binary
        run: |
          python scripts/build_sidecar.py

      - name: Build Frontend Next.js Export
        run: |
          npm --prefix frontend run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Build Tauri Desktop Package
        run: |
          npm run tauri:build
        env:
          CI: false

      - name: Upload Windows Installer Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FB-Automator-Windows-Installer
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
