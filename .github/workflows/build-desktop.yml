name: Build Desktop Installer (Tauri + Python Sidecar)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-desktop:
    name: Build ${{ matrix.platform }} Application
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            runner: windows-latest
            config: src-tauri/tauri.conf.json
          - platform: Linux
            runner: ubuntu-22.04
            config: src-tauri/tauri.linux.conf.json

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Build Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential pkg-config \
            curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            patchelf libfuse2 python3-tk

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Install Root & Frontend Dependencies
        run: |
          npm ci
          npm --prefix frontend ci

      - name: Test Native Packaging and Storage
        run: python -m unittest discover -s tests -p test_desktop_packaging.py

      - name: Build Python Sidecar Binary
        run: |
          python scripts/build_sidecar.py

      - name: Build Tauri Desktop Package
        run: |
          npm run tauri:build -- --config ${{ matrix.config }}
        env:
          CI: false
          NEXT_TELEMETRY_DISABLED: 1
          APPIMAGE_EXTRACT_AND_RUN: 1

      - name: Upload Installer Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FB-Automator-${{ matrix.platform }}-Installer
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
