name: CI - Code Quality & Build Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect affected areas
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      web_admin: ${{ steps.filter.outputs.web_admin }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'frontend/**'
            web_admin:
              - 'web-admin/**'
            backend:
              - 'core/**'
              - 'modules/**'
              - 'config/**'
              - 'scripts/**'
              - 'tests/**'
              - 'requirements.txt'
              - 'engine.py'
              - 'start.py'

  frontend-build:
    name: Frontend Next.js Build
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: frontend/.next/cache
          key: next-frontend-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}-${{ hashFiles('frontend/**') }}
          restore-keys: |
            next-frontend-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}-
      - name: Install frontend dependencies
        run: npm ci
      - name: Build Next.js app
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  frontend-lint:
    name: Frontend ESLint
    needs: changes
    if: (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend == 'true')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Restore ESLint cache
        uses: actions/cache@v4
        with:
          path: frontend/.eslintcache
          key: eslint-frontend-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}-${{ hashFiles('frontend/**/*.[jt]s', 'frontend/**/*.[jt]sx') }}
          restore-keys: |
            eslint-frontend-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}-
      - name: Run ESLint
        run: npm run lint -- --cache --cache-location .eslintcache
        continue-on-error: true

  web-admin:
    name: Web Admin Next.js Build
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.web_admin == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web-admin/package-lock.json
      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: web-admin/.next/cache
          key: next-web-admin-${{ runner.os }}-${{ hashFiles('web-admin/package-lock.json') }}-${{ hashFiles('web-admin/**') }}
          restore-keys: |
            next-web-admin-${{ runner.os }}-${{ hashFiles('web-admin/package-lock.json') }}-
      - name: Install admin dependencies
        run: npm ci
      - name: Build admin app
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  backend-syntax:
    name: Python Syntax Verification
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify Python syntax and compilation
        run: python -m compileall -q core modules config engine.py start.py scripts tests

  backend-tests:
    name: Python Unit Tests
    needs: changes
    if: (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
      - name: Run backend unit tests
        run: PYTHONPATH=. python -m unittest discover -s tests -p "test_*.py"
        continue-on-error: true
