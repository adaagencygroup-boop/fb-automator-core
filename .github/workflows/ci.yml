name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    name: Detect Affected Areas
    runs-on: ubuntu-26.04
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      admin: ${{ steps.filter.outputs.admin }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'frontend/**'
            admin:
              - 'admin/**'
            backend:
              - 'config/**'
              - 'core/**'
              - 'modules/**'
              - 'scripts/**'
              - 'tauri/test*.py'
              - 'engine.py'
              - 'requirements.txt'
              - 'start.py'
  frontend:
    name: Frontend Build
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Restore Build Cache
        uses: actions/cache@v4
        with:
          path: frontend/.next/cache
          key: next-frontend-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}-${{ hashFiles('frontend/**') }}
          restore-keys: |
            next-frontend-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}-
      - name: Install Frontend Dependencies
        run: npm ci
      - name: Build App
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
  admin:
    name: Admin Build
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.admin == 'true'
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - name: Restore Build Cache
        uses: actions/cache@v4
        with:
          path: admin/.next/cache
          key: next-admin-${{ runner.os }}-${{ hashFiles('admin/package-lock.json') }}-${{ hashFiles('admin/**') }}
          restore-keys: |
            next-admin-${{ runner.os }}-${{ hashFiles('admin/package-lock.json') }}-
      - name: Install Admin Dependencies
        run: npm ci
      - name: Build App
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
  backend:
    name: Python Syntax Verification
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify Python Syntax & Compilation
        run: python -m compileall -q config core modules scripts tauri/test.py engine.py start.py
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      # Module 10 (Quét nhóm): chạy song song nhiều Chrome, chia việc, Chạy tiếp, đọc link/tệp —
      # test dùng DB & Chrome giả, không cần .env / Postgres.
      - name: Module 10 Unit Tests
        run: python -m unittest discover -s modules/module_10_group_scan/tests -t . -p "test_*.py" -v