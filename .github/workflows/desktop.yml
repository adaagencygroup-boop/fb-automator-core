name: Build Desktop Installer
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
permissions:
  contents: write
jobs:
  authorizeRelease:
    name: Authorize Releaser
    runs-on: ubuntu-26.04
    steps:
      - name: Check Actor
        env:
          ACTOR: ${{ github.actor }}
          # Danh sách người được chạy Release, cách nhau dấu phẩy (có thể đặt qua biến repo RELEASE_ALLOWED_ACTOR)
          ALLOWED: ${{ vars.RELEASE_ALLOWED_ACTOR || 'peterphenikaa,TrBinhDev' }}
        run: |
          echo "Actor=$ACTOR Allowed=$ALLOWED"
          if ! echo ",${ALLOWED// /}," | grep -qi ",$ACTOR,"; then
            echo "::error::Chỉ @${ALLOWED//,/, @} Dc Chạy Desktop Release (Tag/Workflow Dispatch). Actor Hiện Tại: @$ACTOR"
            exit 1
          fi
  buildDesktop:
    name: Build ${{ matrix.platform }} Application
    needs: authorizeRelease
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            runner: windows-latest
            config: src-tauri/tauri.conf.json
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            tauri/package-lock.json
            frontend/package-lock.json
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip uninstall -y simplejson || true
      - name: Install Root & Frontend Dependencies
        run: |
          npm --prefix tauri ci
          npm --prefix frontend ci
      - name: Test Native Packaging & Storage
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m unittest discover -s tauri -p test.py
      - name: Write Desktop .env For Windows Sidecar Bundle
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          DESKTOP_ENV_FILE: ${{ secrets.DESKTOP_ENV_FILE }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DESKTOP_ENV_FILE)) {
            throw "Thiếu GitHub Secret DESKTOP_ENV_FILE — Paste Nguyên Nội Dung File .env Production Vào Secret Này"
          }
          if ($env:DESKTOP_ENV_FILE -notmatch 'DATABASE_URL\s*=\s*.*postgresql') {
            throw "DESKTOP_ENV_FILE Phải Có DATABASE_URL=postgresql://..."
          }
          [System.IO.File]::WriteAllText(
            (Join-Path $pwd ".env"),
            $env:DESKTOP_ENV_FILE.Trim() + "`n",
            [System.Text.UTF8Encoding]::new($false)
          )
          Write-Host "Wrote .env For PyInstaller (DATABASE_URL PostgreSQL OK)"
      - name: Build Python Sidecar Binary
        run: |
          python scripts/build_sidecar.py
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
      - name: Build Tauri Desktop Package
        run: |
          npm --prefix tauri run tauri:build -- --config ${{ matrix.config }}
        env:
          CI: false
          NEXT_TELEMETRY_DISABLED: 1
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Upload Installer Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FB-Automator-${{ matrix.platform }}-Installer
          if-no-files-found: error
          path: |
            tauri/src-tauri/target/release/bundle/msi/*.msi
            tauri/src-tauri/target/release/bundle/msi/*.sig
            tauri/src-tauri/target/release/bundle/msi/*.zip
            tauri/src-tauri/target/release/bundle/nsis/*.exe
            tauri/src-tauri/target/release/bundle/nsis/*.sig
            tauri/src-tauri/target/release/bundle/nsis/*.zip
  publishRelease:
    name: Publish GitHub Release + latest.json
    needs: buildDesktop
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download All Installer Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: FB-Automator-*-Installer
          merge-multiple: true
      - name: Build latest.json
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python scripts/build_latest_json.py \
            --version "$VERSION" \
            --tag "$GITHUB_REF_NAME" \
            --repo "${{ github.repository }}" \
            --notes "Desktop Release $GITHUB_REF_NAME" \
            --artifact-dir release-artifacts \
            --out latest.json
          echo "---- latest.json ----"
          cat latest.json
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: FB Page Automator ${{ github.ref_name }}
          body: |
            Desktop Build From Tag `${{ github.ref_name }}`
            - Installer Assets Attached Below
            - `latest.json` Is Consumed By The In-App Tauri Updater
          files: |
            latest.json
            release-artifacts/**
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}