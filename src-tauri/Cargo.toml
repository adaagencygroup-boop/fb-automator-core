[package]
name = "fb_page_automator"
version = "2.0.12"
description = "Facebook Automator Pro Enterprise Edition"
authors = ["Ada Agency Group"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-shell = "2.0"
tauri-plugin-deep-link = "2.6.2"
tauri-plugin-single-instance = { version = "2.5.4", features = ["deep-link"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-process = "2.4.0"
tauri-plugin-updater = "2.14.1"
