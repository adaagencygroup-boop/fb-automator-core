services:
  app:
    image: ${appImage:-ghcr.io/adaagencygroup-boop/fb-automator-core/app:latest}
    build: .
    container_name: app
    restart: always
    env_file:
      - .env
    environment:
      ENGINE_HOST: 0.0.0.0
      ENGINE_PORT: "28129"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://admin.adagroupservice.com,https://adagroupservice.com,https://www.adagroupservice.com}
    volumes:
      - downloads:/app/downloads
      - storage:/app/uploads
      - data:/app/data
      - logs:/app/logs
    ports:
      - "127.0.0.1:28129:28129"
    depends_on:
      - postgres
      - redis
    deploy:
      resources:
        limits:
          cpus: '1.2'
          memory: 768M
        reservations:
          cpus: '0.2'
          memory: 256M
    networks:
      - net
  admin:
    image: admin
    build:
      context: ./admin
      target: runner
      args:
        NEXT_PUBLIC_URL: ${NEXT_PUBLIC_URL:-https://admin.adagroupservice.com}
    container_name: admin
    restart: always
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_URL: ${NEXT_PUBLIC_URL:-http://app:28129}
      NODE_OPTIONS: "--max-old-space-size=256"
    depends_on:
      - app
    deploy:
      resources:
        limits:
          cpus: '0.6'
          memory: 384M
        reservations:
          cpus: '0.1'
          memory: 128M
    networks:
      - net
  landing:
    image: landing
    build:
      context: ./landing
    container_name: landing
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 64M
        reservations:
          cpus: '0.02'
          memory: 16M
    networks:
      - net
  postgres:
    image: postgres:latest
    container_name: postgres
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - work_mem=4MB
      - -c
      - max_connections=60
      - -c
      - effective_cache_size=384MB
      - -c
      - maintenance_work_mem=32MB
    volumes:
      - pg:/var/lib/postgresql
    ports:
      - "5432:5432"
    deploy:
      resources:
        limits:
          cpus: '0.8'
          memory: 384M
        reservations:
          cpus: '0.2'
          memory: 128M
    networks:
      - net
  redis:
    image: redis:latest
    container_name: redis
    restart: always
    command: redis-server --maxmemory 96mb --maxmemory-policy allkeys-lru --save 900 1
    volumes:
      - redis:/data
    deploy:
      resources:
        limits:
          cpus: '0.4'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 32M
    networks:
      - net
  nginx:
    image: nginx:latest
    container_name: nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./devops/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./devops/nginx/ssl:/etc/nginx/ssl:ro
      - storage:/var/app/storage:ro
    depends_on:
      - app
      - admin
      - landing
    deploy:
      resources:
        limits:
          cpus: '0.6'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 32M
    networks:
      - net
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: always
    ports:
      - "127.0.0.1:9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    volumes:
      - ./devops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus:/prometheus
    deploy:
      resources:
        limits:
          cpus: '0.4'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 64M
    networks:
      - net
  node:
    image: prom/node-exporter:latest
    container_name: node
    restart: always
    pid: host
    command:
      - --path.procfs=/host/proc
      - --path.rootfs=/rootfs
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M
        reservations:
          cpus: '0.02'
          memory: 32M
    networks:
      - net
  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: always
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./devops/loki/config.yml:/etc/loki/config.yml:ro
      - loki:/loki
    deploy:
      resources:
        limits:
          cpus: '0.4'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 64M
    networks:
      - net
  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    restart: always
    user: "0"
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./devops/promtail/config.yml:/etc/promtail/config.yml:ro
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 64M
        reservations:
          cpus: '0.02'
          memory: 16M
    networks:
      - net
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: always
    user: "0"
    ports:
      - "9000:3000"
    environment:
      GOGC: "50"
    volumes:
      - ./devops/grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./devops/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    deploy:
      resources:
        limits:
          cpus: '0.8'
          memory: 768M
        reservations:
          cpus: '0.1'
          memory: 128M
    networks:
      - net
volumes:
  pg:
  redis:
  storage:
  data:
  downloads:
  logs:
  loki:
  prometheus:
  grafana:
networks:
  net:
    driver: bridge