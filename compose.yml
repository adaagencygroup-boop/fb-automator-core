x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
services:
  app:
    image: ${appImage:-ghcr.io/adaagencygroup-boop/fb-automator-core/app:latest}
    build: .
    container_name: app
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - .env
    environment:
      ENGINE_HOST: 0.0.0.0
      ENGINE_PORT: "28129"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://admin.adagroupservice.com,https://adagroupservice.com,https://www.adagroupservice.com}
    volumes:
      - downloads:/app/downloads
      - storage:/app/uploads
      - data:/app/data
      - logs:/app/logs
    ports:
      - "127.0.0.1:28129:28129"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:28129/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 768M
        reservations:
          cpus: '0.2'
          memory: 256M
    networks:
      - net
  admin:
    image: admin
    build:
      context: ./admin
      target: runner
      args:
        NEXT_PUBLIC_URL: ${NEXT_PUBLIC_URL:-https://admin.adagroupservice.com}
    container_name: admin
    restart: unless-stopped
    logging: *default-logging
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_URL: ${NEXT_PUBLIC_URL:-http://app:28129}
      NODE_OPTIONS: "--max-old-space-size=192"
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>{if(r.status>=500)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 96M
    networks:
      - net
  postgres:
    image: postgres:18
    container_name: postgres
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - work_mem=4MB
      - -c
      - max_connections=100
      - -c
      - effective_cache_size=384MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - random_page_cost=1.1
      - -c
      - checkpoint_completion_target=0.9
    volumes:
      - pg:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '0.8'
          memory: 384M
        reservations:
          cpus: '0.2'
          memory: 128M
    networks:
      - net
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    logging: *default-logging
    command: redis-server --maxmemory 96mb --maxmemory-policy allkeys-lru --save 900 1
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 24M
    networks:
      - net
  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./devops/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./devops/nginx/ssl:/etc/nginx/ssl:ro
      - ./landing:/var/app/landing:ro
      - storage:/var/app/storage:ro
    depends_on:
      - app
      - admin
    healthcheck:
      test: ["CMD-SHELL", "nginx -t >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 96M
        reservations:
          cpus: '0.1'
          memory: 24M
    networks:
      - net
volumes:
  pg:
  redis:
  storage:
  data:
  downloads:
  logs:
networks:
  net:
    driver: bridge