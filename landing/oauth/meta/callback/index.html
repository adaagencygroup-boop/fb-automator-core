<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
  <meta name="referrer" content="no-referrer" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <title>Facebook OAuth Callback — Facebook Automator</title>
  <link rel="icon" type="image/svg+xml" href="/assets/icons/favicon.svg" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(ellipse at 50% 0%, #e8f2ff 0%, #f6f9ff 42%, #f8fafc 100%);
      color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Arial, sans-serif;
    }
    .oauth-callback-card {
      position: relative;
      overflow: hidden;
      width: min(100%, 500px);
      padding: 42px 40px 30px;
      border: 1px solid #e3eaf4;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.96);
      text-align: center;
      box-shadow: 0 28px 80px rgba(30, 64, 112, 0.12), 0 3px 12px rgba(15, 23, 42, 0.04);
    }
    .oauth-callback-card::before {
      content: "";
      position: absolute;
      inset: 0 0 auto;
      height: 4px;
      background: linear-gradient(90deg, #0866ff, #59a7ff);
    }
    .oauth-callback-brand {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 30px;
      color: #475569;
      font-size: 13px;
      font-weight: 650;
    }
    .oauth-callback-brand-mark {
      display: grid;
      place-items: end center;
      width: 26px;
      height: 26px;
      overflow: hidden;
      border-radius: 50%;
      background: linear-gradient(145deg, #2894ff, #0866ff);
      color: #fff;
      font-family: Arial, sans-serif;
      font-size: 24px;
      font-weight: 800;
      line-height: 24px;
    }
    .oauth-callback-status-icon {
      width: 66px;
      height: 66px;
      display: grid;
      place-items: center;
      margin: 0 auto 18px;
      border-radius: 20px;
      font-size: 29px;
      font-weight: 700;
    }
    .oauth-callback-status-icon.is-loading { background: #eff6ff; }
    .oauth-callback-status-icon.is-success { background: #ecfdf5; color: #059669; }
    .oauth-callback-status-icon.is-error { background: #fef2f2; color: #dc2626; }
    .oauth-callback-spinner {
      width: 30px;
      height: 30px;
      border: 3px solid #bfdbfe;
      border-top-color: #1877f2;
      border-radius: 50%;
      animation: oauth-spin 0.8s linear infinite;
    }
    .oauth-callback-eyebrow {
      margin: 0 0 8px;
      color: #64748b;
      font-size: 11px;
      font-weight: 750;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .oauth-callback-eyebrow.is-success { color: #047857; }
    .oauth-callback-eyebrow.is-error { color: #b91c1c; }
    h1 {
      margin: 0;
      color: #172033;
      font-size: clamp(21px, 4vw, 25px);
      line-height: 1.3;
      font-weight: 750;
      letter-spacing: -0.025em;
    }
    .oauth-callback-message {
      max-width: 390px;
      margin: 12px auto 0;
      color: #526176;
      font-size: 15px;
      line-height: 1.7;
    }
    .oauth-callback-note {
      display: none;
      margin: 17px 0 0;
      padding: 12px 14px;
      border: 1px solid #e7edf5;
      border-radius: 12px;
      background: #f8fafc;
      color: #64748b;
      font-size: 12px;
      line-height: 1.6;
      text-align: left;
    }
    .oauth-callback-button {
      display: none;
      min-height: 44px;
      margin: 22px auto 0;
      padding: 0 22px;
      border: 0;
      border-radius: 11px;
      background: #1877f2;
      color: #fff;
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 5px 12px rgba(24, 119, 242, 0.2);
      transition: background 0.15s, transform 0.15s;
    }
    .oauth-callback-button:hover { background: #0866d8; transform: translateY(-1px); }
    .oauth-callback-button:focus-visible { outline: 3px solid #93c5fd; outline-offset: 3px; }
    .oauth-callback-security {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      margin-top: 27px;
      color: #94a3b8;
      font-size: 11px;
    }
    .oauth-callback-security span { color: #22c55e; font-size: 8px; }
    @keyframes oauth-spin { to { transform: rotate(360deg); } }
    @media (max-width: 520px) {
      .oauth-callback-card { padding: 34px 22px 24px; border-radius: 20px; }
      .oauth-callback-brand { margin-bottom: 25px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .oauth-callback-spinner { animation-duration: 2s; }
      .oauth-callback-button { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <section id="card" class="oauth-callback-card" aria-live="polite" aria-busy="true">
      <div class="oauth-callback-brand">
        <span class="oauth-callback-brand-mark" aria-hidden="true">f</span>
        <span>Facebook Automator</span>
      </div>
      <div id="status-icon" class="oauth-callback-status-icon is-loading" aria-hidden="true">
        <span class="oauth-callback-spinner"></span>
      </div>
      <p id="eyebrow" class="oauth-callback-eyebrow">Facebook OAuth</p>
      <h1 id="title">Đang kiểm tra kết quả</h1>
      <p id="message" class="oauth-callback-message">Vui lòng chờ trong giây lát.</p>
      <p id="note" class="oauth-callback-note"></p>
      <button id="close-btn" class="oauth-callback-button" type="button">Đóng trang</button>
      <div class="oauth-callback-security"><span aria-hidden="true">●</span> Kết quả xác thực được chuyển an toàn về ứng dụng</div>
    </section>
  </main>

  <script>
    (function () {
      var LOCAL_CALLBACK_URL = "http://127.0.0.1:28129/oauth/meta/callback";

      function readOAuthResult(hash) {
        var raw = hash && hash.charAt(0) === "#" ? hash.slice(1) : (hash || "");
        var params = new URLSearchParams(raw);
        return {
          state: params.get("state") || "",
          accessToken: params.get("access_token") || "",
          error: params.get("error_description") || params.get("error") || ""
        };
      }

      function makeLocalCallbackUrl(result) {
        var params = new URLSearchParams();
        params.set("state", result.state);
        if (result.accessToken) params.set("access_token", result.accessToken);
        if (result.error) params.set("error", result.error);
        return LOCAL_CALLBACK_URL + "#" + params.toString();
      }

      var card = document.getElementById("card");
      var iconEl = document.getElementById("status-icon");
      var eyebrowEl = document.getElementById("eyebrow");
      var titleEl = document.getElementById("title");
      var messageEl = document.getElementById("message");
      var noteEl = document.getElementById("note");
      var closeBtn = document.getElementById("close-btn");

      closeBtn.addEventListener("click", function () {
        window.close();
      });

      function renderView(opts) {
        card.setAttribute("aria-busy", opts.busy ? "true" : "false");
        iconEl.className = "oauth-callback-status-icon is-" + opts.icon;
        if (opts.icon === "loading") {
          iconEl.innerHTML = '<span class="oauth-callback-spinner"></span>';
        } else {
          iconEl.textContent = opts.icon === "success" ? "✓" : "!";
        }
        eyebrowEl.className = "oauth-callback-eyebrow" + (opts.icon !== "loading" ? " is-" + opts.icon : "");
        eyebrowEl.textContent = opts.eyebrow;
        titleEl.textContent = opts.title;
        messageEl.textContent = opts.message;
        if (opts.note) {
          noteEl.textContent = opts.note;
          noteEl.style.display = "block";
        } else {
          noteEl.style.display = "none";
        }
        closeBtn.style.display = opts.showClose ? "inline-block" : "none";
      }

      var result = readOAuthResult(window.location.hash);

      if (result.state.indexOf("profile.") === 0) {
        if (result.error || !result.accessToken) {
          renderView({
            busy: false,
            icon: "error",
            eyebrow: "Facebook chưa cấp quyền",
            title: "Kết nối chưa hoàn tất",
            message: "Bạn đã hủy hoặc từ chối cấp quyền Facebook. Hãy quay lại ứng dụng, mở mục Quản lý Page và bấm Kết nối Facebook để thử lại.",
            note: "Trang được giữ nguyên để ứng dụng đọc kết quả từ Chrome profile. Hãy quay lại ứng dụng sau khi xử lý xong.",
            showClose: false
          });
        } else {
          renderView({
            busy: false,
            icon: "success",
            eyebrow: "Đã nhận kết quả",
            title: "Đang xác thực Facebook",
            message: "Giữ trang này mở để ứng dụng nhận kết quả và tiếp tục đồng bộ Page.",
            note: "Trang được giữ nguyên để ứng dụng đọc kết quả từ Chrome profile. Hãy quay lại ứng dụng sau khi xử lý xong.",
            showClose: false
          });
        }
        return;
      }

      if (result.state.indexOf("web-popup.") === 0) {
        renderView({
          busy: true,
          icon: "loading",
          eyebrow: "Đang kết nối với ứng dụng",
          title: "Đang chuyển kết quả",
          message: "Kết quả xác thực đang được gửi về ứng dụng trên máy này.",
          note: "Nếu engine chưa chạy, hãy mở ứng dụng rồi tải lại callback trước khi phiên xác thực hết hạn.",
          showClose: false
        });
        window.location.replace(makeLocalCallbackUrl(result));
        return;
      }

      renderView({
        busy: false,
        icon: "error",
        eyebrow: "Không thể hoàn tất",
        title: "Phiên kết nối không hợp lệ",
        message: "Phiên kết nối đã hết hoặc không còn hợp lệ. Hãy đóng trang này, quay lại ứng dụng, mở mục Quản lý Page và bấm Kết nối Facebook để bắt đầu lại.",
        note: "",
        showClose: true
      });
    })();
  </script>
</body>
</html>
