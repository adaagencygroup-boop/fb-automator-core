services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_BIND:-0.0.0.0}:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:8.14
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_CHECK_EMAIL_DELIVERABILITY: "False"
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "False"
      PGADMIN_CONFIG_WTF_CSRF_SSL_STRICT: "False"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    expose:
      - "80"

  engine:
    build:
      context: ..
      dockerfile: deploy/engine.Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CORS_ORIGINS: ${CORS_ORIGINS}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      ENGINE_HOST: 0.0.0.0
      ENGINE_PORT: "28129"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ENGINE_PORT:-28130}:28129"
    expose:
      - "28129"

  admin:
    build:
      context: ..
      dockerfile: deploy/admin.Dockerfile
      args:
        NEXT_PUBLIC_VPS_API_URL: ${PUBLIC_API_URL}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ADMIN_PORT:-3011}:3010"
    expose:
      - "3010"
    depends_on:
      - engine

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
    environment:
      ADMIN_HOST: ${ADMIN_HOST}
      API_HOST: ${API_HOST}
      PGADMIN_HOST: ${PGADMIN_HOST}
      NGINX_ENVSUBST_FILTER: "^(ADMIN_HOST|API_HOST|PGADMIN_HOST)$$"
    depends_on:
      - admin
      - engine
      - pgadmin

volumes:
  pgdata:
